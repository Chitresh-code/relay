<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>{agent_name}</title>
</head>
<body style="margin:0;padding:32px 16px;background:#1c1e24;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0">
    <tr>
      <td align="center">
        <table role="presentation" width="480" cellpadding="0" cellspacing="0" style="max-width:480px;width:100%;background:#1a1c22;border:1px solid #33363f;border-radius:10px;">
          <tr>
            <td style="padding:32px 32px 24px;">
              <div style="font:600 12px/1 'JetBrains Mono',ui-monospace,monospace;letter-spacing:0.14em;color:#e0a458;text-transform:uppercase;margin-bottom:18px;">
                {agent_name}
              </div>
              <div style="font:600 20px/1.3 -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:#f2f1ee;margin-bottom:14px;">
                Got your message
              </div>
              <div style="font:14px/1.6 -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:#b3b0aa;">
                Thanks for reaching out &mdash; I've received your message and will get back to you at the earliest.
              </div>
            </td>
          </tr>
          <tr>
            <td style="padding:16px 32px 28px;border-top:1px solid #2b2e36;">
              <div style="font:11px/1.5 'JetBrains Mono',ui-monospace,monospace;color:#6b6e78;">
                Sent automatically by {agent_name} &mdash; no action needed.
              </div>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
